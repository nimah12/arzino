name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test (with coverage threshold)
        run: npm run test:coverage

      - name: Build
        run: npm run build

  e2e:
    name: E2E visual tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Playwright's webServer starts `npm run start` in CI — the production
      # bundle must exist before the tests run, so build it here.
      - name: Build production bundle
        run: npm run build

      - name: Run E2E tests against production build
        run: npm run test:e2e
